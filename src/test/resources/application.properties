# Test-only overrides: unit and slice tests must not run Flyway MariaDB migrations.
spring.flyway.enabled=false
# Slice tests need a managed schema instead of the production validate-only mode.
spring.jpa.hibernate.ddl-auto=create-drop
# Stub environment-backed placeholders so slice tests can build a context.
LOG_APPLICATION_LEVEL=INFO
LOG_API_LEVEL=INFO
LOG_LIBRARY_LEVEL=WARN
LOG_FRAMEWORK_LEVEL=WARN
DB_USERNAME=test
DB_PASSWORD=test
DB_CONNECTION=mariadb
DB_HOST=localhost
DB_PORT=3306
DB_DATABASE=test
SENTRY_SERVICE_DSN=https://test@localhost/1
ENVIRONMENT=test
JWT_SIGNING_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
DISCORD_BOT_TOKEN=test
DISCORD_CLIENT_ID=test
DISCORD_CLIENT_SECRET=test
DISCORD_SCOPE=test
DISCORD_REDIRECT_URI=http://localhost/test
